name: CI

on:
  push:
    branches: [main]
  pull_request:

# Por omisión, solo leer. El job que publica la imagen pide lo suyo aparte.
permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - name: Pruebas unitarias
        run: npm test
      - name: Pruebas de integración (PostgreSQL 18 con Testcontainers)
        run: npm run test:integracion
      - name: Navegador para las pruebas e2e
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Pruebas e2e y accesibilidad (axe)
        run: npm run e2e -w @uvm/web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: web/test-results
          retention-days: 7

  imagen:
    needs: verificar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      # Las etiquetas de Docker van en minúsculas (el dueño del repo puede no estarlo).
      - run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGEN }}:latest
            ${{ env.IMAGEN }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Deja constancia de con qué commit y con qué materiales se armó la imagen.
          provenance: true
          sbom: true
