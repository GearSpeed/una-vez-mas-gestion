name: CI

on:
  push:
    branches: [main]
  pull_request:

# Por omisión, solo leer. El job que publica la imagen pide lo suyo aparte.
permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Lo que se despliega no puede llevar vulnerabilidades conocidas: esto corta.
      - name: Dependencias de producción sin vulnerabilidades conocidas
        run: npm audit --omit=dev --audit-level=high
      # Las herramientas de desarrollo se avisan, pero no detienen el despliegue:
      # un aviso del servidor de esbuild (que nos llega por drizzle-kit y nunca
      # corre en producción) no es razón para no poder publicar un arreglo.
      - name: Aviso de las herramientas de desarrollo
        run: npm audit --audit-level=moderate || true
      - run: npm run format:check
      # Compilar antes de revisar: el lint usa los tipos de compartido/dist, que no
      # viene en el repositorio.
      - run: npm run build
      - run: npm run lint
      - name: Pruebas unitarias
        run: npm test
      - name: Pruebas de integración (PostgreSQL 18 con Testcontainers)
        run: npm run test:integracion
      - name: Navegador para las pruebas e2e
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Pruebas e2e y accesibilidad (axe)
        run: npm run e2e -w @uvm/web
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e
          path: web/test-results
          retention-days: 7

  imagen:
    needs: verificar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      # Las etiquetas de Docker van en minúsculas (el dueño del repo puede no estarlo).
      - run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGEN }}:latest
            ${{ env.IMAGEN }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Deja constancia de con qué commit y con qué materiales se armó la imagen.
          provenance: true
          sbom: true
